<div class="profile-intro">

      <p class="subtitle" data-en="__PROFILE_FIELD_EN__" data-ja="__PROFILE_FIELD_JA__">
        __PROFILE_FIELD_EN__
      </p>

      <p class="tagline">
        <em>

          <span data-en="__PROFILE_INTRO_1_EN__"
            data-ja="__PROFILE_INTRO_1_JA__">
            __PROFILE_INTRO_1_EN__
          </span>

          <br>

          <span data-en="__PROFILE_INTRO_2_EN__"
            data-ja="__PROFILE_INTRO_2_JA__">
            __PROFILE_INTRO_2_EN__
          </span>

        </em>
      </p>

      <div class="icons" role="group" aria-label="Academic profiles and contact">

        <a href="__GOOGLE_SCHOLAR__" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar (external link)">
          <span class="icon-label">Google Scholar</span>
          <span class="profile-link-indicator" aria-hidden="true">↗</span>
        </a>

        <a href="__ORCID__" target="_blank" rel="noopener noreferrer" aria-label="ORCID (external link)">
          <span class="icon-label">ORCID</span>
          <span class="profile-link-indicator" aria-hidden="true">↗</span>
        </a>

        <a href="__LINKEDIN__" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (external link)">
          <span class="icon-label">LinkedIn</span>
          <span class="profile-link-indicator" aria-hidden="true">↗</span>
        </a>

        <div data-nosnippet>
          <a href="mailto:__PERSON_EMAIL__" class="copy-email" data-email="__PERSON_EMAIL__"
            aria-label="Copy email address" title="Click to copy email address">
            <span class="icon-label">Email</span>
            <span class="profile-link-indicator" aria-hidden="true">Copy</span>
          </a>
        </div>

      </div>

      <figure class="profile-portrait">

        <div class="profile-portrait-frame">

          <picture>
            <source srcset="/assets/etc/profile-portrait.webp" type="image/webp">
            <img src="__PROFILE_IMAGE__" alt="Portrait of __PERSON_NAME__" width="348" height="478" decoding="async">
          </picture>

        </div>

      </figure>

    </div>
